name: Run UI Tests and Deploy Report

# 1. Триггеры для запуска
on:
  push:
    branches: [ main ] # Запуск при пуше в main
  pull_request:
    branches: [ main ] # Запуск при создании PR в main

jobs:
  test-and-report:
    # 2. Настройка виртуальной машины
    runs-on: ubuntu-latest

    steps:
      # 3. Шаг: Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4. Шаг: Установка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 5. Шаг: Установка зависимостей с кешированием
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 6. Шаг: Запуск тестов
      # Важно: `|| true` в конце гарантирует, что следующий шаг (генерация отчета) 
      # выполнится, даже если тесты упадут.
      - name: Run Pytest
        run: |
          pytest -n auto --alluredir=allure-results || true

      # 7. Шаг: Генерация Allure-отчета
      # Этот action возьмет результаты из allure-results и сгенерирует HTML-отчет
      - name: Generate Allure Report
        uses: allure-framework/allure-action@v1
        with:
          report_path: allure-report
          results_path: allure-results

      # 8. Шаг: Деплой отчета на GitHub Pages
      # Этот action опубликует содержимое папки allure-report в специальную ветку gh-pages
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          # Эта опция нужна, чтобы отчеты из разных запусков не затирали друг друга
          keep_files: true